manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: tangbonze
      url-base: https://github.com/tangbonze
    - name: manna-harbour
      url-base: https://github.com/manna-harbour
    - name: kmobs
      url-base: https://github.com/kmobs
    - name: M165437
      url-base: https://github.com/M165437
  projects:
    # ZMK 0.4 stack (Zephyr 3.7 / LVGL 9). Required by the display modules
    # (Prospector + nice-view-gem). Split transport is BLE: the dongle is the
    # BLE central and speaks HID to the host over USB; both halves are BLE
    # peripherals. (Was damex ESB — reverted; ESB lost the Prospector dongle
    # screens and drained the halves harder than BLE.)
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    # Prospector fork with the BLE "new status" screens (Operator/Field layouts
    # + native zmk_split_central_status_changed observer under CONFIG_ZMK_BLE).
    - name: zmk-prospector
      remote: kmobs
      revision: blenewstatus
    # nice!view "gem" widgets for the halves (LVGL 9 / ZMK 0.4).
    - name: nice-view-gem
      remote: M165437
      revision: main
    - name: zmk-pmw3610-driver
      remote: tangbonze
      revision: main
    - name: miryoku_zmk
      remote: manna-harbour
      revision: master
      path: miryoku
  self:
    path: config
