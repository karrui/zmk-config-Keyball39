# Enable split keyboard support. Transport is BLE: the dongle is the BLE central
# and speaks HID to the host over USB (studio-rpc-usb-uart snippet); both halves
# connect as BLE peripherals. Central role + peripheral count are set in
# Kconfig.defconfig; BLE/BT tuning lives in the shared config/keyball39.conf.
CONFIG_ZMK_SPLIT=y

# Battery reporting for the halves, fetched + proxied over BLE.
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Input subsystem sizing for the high-rate pointer stream from the right half.
CONFIG_INPUT_THREAD_STACK_SIZE=4096
CONFIG_INPUT_QUEUE_MAX_MSGS=256

# Prospector status screen: "operator" layout — numeric WPM meter, layer name,
# and per-half battery circles. Under BLE the fork's native
# zmk_split_central_status_changed observer drives the connection state (no stub).
CONFIG_PROSPECTOR_STATUS_SCREEN_OPERATOR=y

# Enable display
CONFIG_ZMK_DISPLAY=y

# Single LVGL draw buffer instead of double-buffering. The ZMK 0.4 Prospector
# (LVGL 9, 240x240 color TFT) plus the now-enabled BLE central stack overflowed
# RAM by ~12KB (the ESB build fit only because BLE was off). Dropping the second
# VDB reclaims ~half the draw buffer (~57KB) — ample headroom; the status screen
# isn't animation-heavy, so single-buffered rendering is fine.
CONFIG_LV_Z_DOUBLE_VDB=n

# Enable display work queue
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# Enable ZMK Studio
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Enable pointing/mouse subsystem
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING=y
