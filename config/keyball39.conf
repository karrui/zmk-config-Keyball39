# BLE split tuning (dongle central ↔ two peripheral halves). Restored when the
# transport reverted from ESB back to BLE.
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
CONFIG_BT_PERIPHERAL_PREF_LATENCY=16
CONFIG_BT_BUF_ACL_TX_COUNT=8
CONFIG_BT_BUF_EVT_RX_COUNT=10
CONFIG_BT_L2CAP_TX_BUF_COUNT=32

# Set transmission power to max for range/reliability across the split.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_BT_DEVICE_NAME_MAX=30

CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512

# Enable the guarded MEDIA-layer soft-off binding on every split part.
CONFIG_ZMK_PM_SOFT_OFF=y

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_EXT_POWER=y
