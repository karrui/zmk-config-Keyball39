# Deep sleep after 15 min idle, to match the right half. Both halves are
# peripherals of the dongle now, so they should sleep symmetrically. A key press
# wakes the half (see wakeup-source on kscan0 in keyball39.dtsi); the dongle
# stays awake and re-scans, and reconnect takes a couple seconds.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
