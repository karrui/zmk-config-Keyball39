manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: tangbonze
      url-base: https://github.com/tangbonze
    - name: carrefinho
      url-base: https://github.com/carrefinho
    - name: manna-harbour
      url-base: https://github.com/manna-harbour
    - name: badjeff
      url-base: https://github.com/badjeff
    - name: nrfconnect
      url-base: https://github.com/nrfconnect
    - name: M165437
      url-base: https://github.com/M165437
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: v0.3
      import: app/west.yml
    - name: zmk-pmw3610-driver
      remote: tangbonze
      revision: main
    - name: prospector-zmk-module
      remote: carrefinho
      revision: main
    - name: miryoku_zmk
      remote: manna-harbour
      revision: master
      path: miryoku
    # nice!view "gem" widgets. Replaces the stock nice_view shield on the
    # halves; its peripheral connection status is stubbed for ESB (see
    # keyball_stubs.c).
    - name: nice-view-gem
      remote: M165437
      revision: main
    # ESB split transport (replaces BLE split). The zmk-0.3 branch targets the
    # same NCS/Zephyr base as zmk v0.3 (NCS v2.6.4 / Zephyr v3.5.99).
    - name: zmk-feature-split-esb
      remote: badjeff
      revision: zmk-0.3
    - name: sdk-nrf
      remote: nrfconnect
      revision: v2.6.4
      path: nrf
    - name: nrfxlib
      remote: nrfconnect
      revision: v2.6.4
      repo-path: sdk-nrfxlib
      path: nrfxlib
  self:
    path: config
