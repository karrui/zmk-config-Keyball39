manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: tangbonze
      url-base: https://github.com/tangbonze
    - name: manna-harbour
      url-base: https://github.com/manna-harbour
    - name: badjeff
      url-base: https://github.com/badjeff
    - name: nrfconnect
      url-base: https://github.com/nrfconnect
    - name: kmobs
      url-base: https://github.com/kmobs
    - name: M165437
      url-base: https://github.com/M165437
  projects:
    # ZMK 0.4 stack (Zephyr 3.7 / LVGL 9). Required by the ESB display modules
    # (Prospector + nice-view-gem). Mirrors kmobs/zmk-config@dongle_esb_prospector.
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    # ESB split transport + patched NCS (main branch targets NCS v3.1 / ZMK 0.4).
    - name: zmk-feature-split-esb
      remote: badjeff
      revision: main
    - name: sdk-nrf
      remote: badjeff
      revision: v3.1-branch+zmk-fixes
      path: nrf
    - name: nrfxlib
      remote: nrfconnect
      revision: v3.1-branch
      repo-path: sdk-nrfxlib
      path: nrfxlib
    # Prospector fork patched to build under ESB (stock carrefinho module does not).
    - name: zmk-prospector
      remote: kmobs
      revision: blenewstatus
    # nice!view "gem" widgets for the halves (LVGL 9 / ZMK 0.4).
    - name: nice-view-gem
      remote: M165437
      revision: main
    - name: zmk-pmw3610-driver
      remote: tangbonze
      revision: main
    - name: miryoku_zmk
      remote: manna-harbour
      revision: master
      path: miryoku
  self:
    path: config
