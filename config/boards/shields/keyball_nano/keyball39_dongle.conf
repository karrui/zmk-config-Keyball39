# Enable split keyboard support
CONFIG_ZMK_SPLIT=y

# --- ESB split transport (replaces BLE split) ---
# USB-only dongle topology: dongle talks to the host over USB, and to both
# halves over ESB. BLE is fully disabled. Values from the module's zmk-0.3
# branch README (NCS v2.6.4 / Zephyr v3.5.99).
CONFIG_ZMK_BLE=n
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=n
CONFIG_ZMK_SPLIT_ESB=y
# Number of ESB peripherals (>= max peripheral id). Used for battery storage on
# the central; valid for ESB-only even though the name reads BLE.
CONFIG_ZMK_SPLIT_ESB_PERIPHERAL_COUNT=2
CONFIG_ZMK_SPLIT_ESB_PROTO_TX_ACK=y
CONFIG_ZMK_SPLIT_ESB_PROTO_TX_RETRANSMIT_DELAY=600
CONFIG_ZMK_SPLIT_ESB_PROTO_TX_RETRANSMIT_COUNT=3
CONFIG_MPSL_TIMESLOT_SESSION_COUNT=1
# Buffer/queue sizing, raised from the old 0.3-branch minimums (16/16/4) so the
# trackball's high input-event rate doesn't overflow the queues (a cause of
# dropped/laggy input). Matches kmobs's proven ESB config.
CONFIG_ZMK_SPLIT_ESB_PROTO_MSGQ_ITEMS=64
CONFIG_ZMK_SPLIT_ESB_EVENT_BUFFER_ITEMS=64
CONFIG_ZMK_SPLIT_ESB_CMD_BUFFER_ITEMS=16
CONFIG_ZMK_SPLIT_ESB_MSGQ_FULL_TIMEOUT_MS=3000
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_ESB_MAX_PAYLOAD_LENGTH=48
CONFIG_ESB_TX_FIFO_SIZE=1

# Input subsystem sizing for the high-rate pointer stream.
CONFIG_INPUT_THREAD_STACK_SIZE=4096
CONFIG_INPUT_QUEUE_MAX_MSGS=256

# One extra retransmit for pointer packets to cut jitter at range (default 1
# with channel hopping). Lower to 1 for a sharper but lossier feel.
CONFIG_ZMK_SPLIT_ESB_RETRY_INPUT_EVENT=2

# BLE previously pulled in an RNG; with it off, provide one explicitly for ESB.
CONFIG_ENTROPY_GENERATOR=y
CONFIG_XOSHIRO_RANDOM_GENERATOR=y

# Battery reporting for the halves, fetched over ESB. The ESB module
# re-implements these central symbols when BLE split is disabled.
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Prospector status screen: use the "field" layout. The default "classic"
# layout renders BLE HID output/profile state (zmk_ble_profile_*), which does
# not exist with BLE disabled; "field" is the BLE-free layout kmobs uses.
CONFIG_PROSPECTOR_STATUS_SCREEN_FIELD=y

# Enable display
CONFIG_ZMK_DISPLAY=y

# Enable display work queue
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# Enable ZMK Studio
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Enable pointing/mouse subsystem
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING=y
