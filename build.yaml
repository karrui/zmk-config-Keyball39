include:
  # 0.4 stack uses Zephyr hwmv2 board targets: xiao_ble / nice_nano with the
  # `zmk` variant (was seeeduino_xiao_ble / nice_nano_v2). Mirrors kmobs.
  # artifact-name is required: the `//` in the board target otherwise breaks
  # the default output filename (cp fails on the nonexistent path).
  - board: xiao_ble//zmk
    shield: keyball39_dongle prospector_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: keyball39_dongle
  # BLANK_ON_IDLE via cmake-args (merged last) to override gem's forced =n and
  # power down the OLED when idle.
  - board: nice_nano//zmk
    shield: keyball39_left nice_view_adapter nice_view_gem
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n -DCONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
    artifact-name: keyball39_left
  - board: nice_nano//zmk
    shield: keyball39_right nice_view_adapter nice_view_gem
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n -DCONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
    artifact-name: keyball39_right
  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: nice_nano_settings_reset
  - board: xiao_ble//zmk
    shield: settings_reset
    artifact-name: xiao_ble_settings_reset
