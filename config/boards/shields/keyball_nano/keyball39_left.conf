# Deep sleep after 30 min idle, to match the right half. Both halves are BLE
# peripherals of the dongle, so they should sleep symmetrically. A key press
# wakes the half (see wakeup-source on kscan0 in keyball39.dtsi); the dongle
# stays awake and re-scans, and reconnect takes a couple seconds.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Report this half's battery to the central over the BLE split.
CONFIG_ZMK_BATTERY_REPORTING=y
