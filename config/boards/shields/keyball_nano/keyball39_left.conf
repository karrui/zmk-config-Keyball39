# Deep sleep after 15 min idle, to match the right half. Both halves are BLE
# peripherals of the dongle, so they should sleep symmetrically. A key press
# wakes the half (see wakeup-source on kscan0 in keyball39.dtsi); the dongle
# stays awake and re-scans, and reconnect takes a couple seconds.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Report this half's battery to the central over the BLE split.
CONFIG_ZMK_BATTERY_REPORTING=y

# Render a single static gem frame instead of the animated crystal. The nice!view
# is a low-power Sharp memory LCD; the animation's only cost is waking the CPU +
# display thread every ~960 ms to re-render while the half is active. Disabling it
# removes those wakeups (a battery win) at no build risk.
CONFIG_NICE_VIEW_GEM_ANIMATION=n
