# Deep sleep after 15 min idle, to match the right half. Both halves are
# peripherals of the dongle now, so they should sleep symmetrically. A key press
# wakes the half (see wakeup-source on kscan0 in keyball39.dtsi); the dongle
# stays awake and re-scans, and reconnect takes a couple seconds.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# --- ESB split transport (damex/zmk-feature-split-esb) ---
# Peripheral half: ESB to the dongle, no BLE. This half's identity (ESB pipe)
# is set in its overlay via `chosen { zmk,esb-self = &peripheral_left; }`.
# Adaptive hopping and keepalive link status come from the shared zmk,split-esb
# devicetree node (see keyball39.dtsi).
CONFIG_ZMK_BLE=n
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=n
CONFIG_ZMK_SPLIT_ESB=y
CONFIG_ZMK_SPLIT_ESB_MAX_PAYLOAD=48
CONFIG_ESB_MAX_PAYLOAD_LENGTH=48
CONFIG_ZMK_SPLIT_ESB_RX_QUEUE_SIZE=32
CONFIG_ZMK_SPLIT_ESB_COMMAND_QUEUE_SIZE=8

# Input subsystem sizing for the high-rate pointer stream.
CONFIG_INPUT_THREAD_STACK_SIZE=4096
CONFIG_INPUT_QUEUE_MAX_MSGS=256

# Battery for the local nice_view widget and to report to the dongle over ESB.
CONFIG_ZMK_BATTERY_REPORTING=y

# BLE previously pulled in an RNG; with it off we must provide one explicitly
# (nice-view-gem's animation and ESB both need sys_rand32_get).
CONFIG_ENTROPY_GENERATOR=y
CONFIG_XOSHIRO_RANDOM_GENERATOR=y
